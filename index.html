<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Form System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/qrcode.react@3.1.0/dist/qrcode.react.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .dashboard-card {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
        }
        
        h2 {
            font-size: 18px;
            color: #333;
            margin: 20px 0 15px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        
        button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .success-msg {
            margin-top: 15px;
            padding: 12px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        
        .error-msg {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        
        .secondary-btn {
            background-color: #6c757d;
            margin-top: 20px;
            width: auto;
        }
        
        .secondary-btn:hover {
            background-color: #5a6268;
        }
        
        .danger-btn {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        
        .danger-btn:hover {
            background-color: #c82333;
        }
        
        .logout-btn {
            background-color: #dc3545;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        
        .dashboard-header h1 {
            margin: 0;
        }
        
        .qr-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 6px;
        }
        
        .qr-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        
        .stat-box {
            flex: 1;
            padding: 20px;
            background-color: #f0f4ff;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
            background-color: #f0f0f0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }
        
        .export-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .export-btn {
            background-color: #28a745;
            max-width: 200px;
            margin: 0 auto;
        }
        
        .export-btn:hover {
            background-color: #218838;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .code {
            background-color: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .demo-note {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            text-align: center;
        }
        
        .demo-note strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentPage, setCurrentPage] = useState('form');
            const [formData, setFormData] = useState({ name: '', email: '', phone: '' });
            const [submissions, setSubmissions] = useState([]);
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);
            const [loginAttempt, setLoginAttempt] = useState('');
            const [password, setPassword] = useState('');
            const [formUrl, setFormUrl] = useState('');

            // Load submissions from localStorage
            useEffect(() => {
                const saved = localStorage.getItem('formSubmissions');
                if (saved) {
                    setSubmissions(JSON.parse(saved));
                }
                setFormUrl(window.location.origin);
            }, []);

            const handleFormSubmit = (e) => {
                e.preventDefault();
                setLoading(true);

                if (!formData.name || !formData.email || !formData.phone) {
                    alert('Please fill in all fields');
                    setLoading(false);
                    return;
                }

                const newSubmission = {
                    ...formData,
                    id: Date.now(),
                    timestamp: new Date().toLocaleString()
                };

                const updated = [...submissions, newSubmission];
                setSubmissions(updated);
                localStorage.setItem('formSubmissions', JSON.stringify(updated));

                setFormData({ name: '', email: '', phone: '' });
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 3000);
                setLoading(false);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginAttempt === 'admin123') {
                    setIsLoggedIn(true);
                    setCurrentPage('dashboard');
                    setLoginAttempt('');
                } else {
                    setPassword('Wrong password');
                    setTimeout(() => setPassword(''), 2000);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentPage('form');
                setLoginAttempt('');
            };

            const deleteSubmission = (id) => {
                const updated = submissions.filter(sub => sub.id !== id);
                setSubmissions(updated);
                localStorage.setItem('formSubmissions', JSON.stringify(updated));
            };

            const exportToCSV = () => {
                const csv = [
                    ['Name', 'Email', 'Phone', 'Date'],
                    ...submissions.map(s => [s.name, s.email, s.phone, s.timestamp])
                ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'submissions.csv';
                a.click();
            };

            // FORM PAGE
            if (!isLoggedIn && currentPage === 'form') {
                return (
                    <div style={{ minHeight: '100vh', backgroundColor: '#f5f5f5', padding: '20px' }}>
                        <div className="container">
                            <div className="card">
                                <h1>Contact Information</h1>
                                
                                <form onSubmit={handleFormSubmit}>
                                    <div className="form-group">
                                        <label>Name</label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            placeholder="Enter your name"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>Email</label>
                                        <input
                                            type="email"
                                            value={formData.email}
                                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                                            placeholder="Enter your email"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>Phone</label>
                                        <input
                                            type="tel"
                                            value={formData.phone}
                                            onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                            placeholder="Enter your phone"
                                        />
                                    </div>

                                    <button type="submit" disabled={loading}>
                                        {loading ? 'Submitting...' : 'Submit'}
                                    </button>
                                </form>

                                {submitted && <div className="success-msg">✓ Thanks! Your info was received.</div>}

                                <div className="admin-link">
                                    <button 
                                        className="secondary-btn"
                                        onClick={() => setCurrentPage('dashboard')}
                                    >
                                        Admin Dashboard
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // LOGIN PAGE
            if (!isLoggedIn && currentPage === 'dashboard') {
                return (
                    <div style={{ minHeight: '100vh', backgroundColor: '#f5f5f5', padding: '20px' }}>
                        <div className="container">
                            <div className="card">
                                <h1>Dashboard Login</h1>
                                <form onSubmit={handleLogin}>
                                    <div className="form-group">
                                        <label>Password</label>
                                        <input
                                            type="password"
                                            value={loginAttempt}
                                            onChange={(e) => setLoginAttempt(e.target.value)}
                                            placeholder="Enter admin password"
                                        />
                                    </div>
                                    <button type="submit">Login</button>
                                </form>
                                {password && <div className="error-msg">{password}</div>}
                                <button 
                                    className="secondary-btn"
                                    onClick={() => setCurrentPage('form')}
                                >
                                    Back to Form
                                </button>
                                <div className="demo-note">
                                    <strong>Demo password: admin123</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // DASHBOARD PAGE
            if (isLoggedIn) {
                return (
                    <div style={{ minHeight: '100vh', backgroundColor: '#f5f5f5', padding: '20px' }}>
                        <div className="dashboard-card">
                            <div className="dashboard-header">
                                <h1 style={{ margin: 0 }}>Submissions Dashboard</h1>
                                <button className="logout-btn" onClick={handleLogout}>Logout</button>
                            </div>

                            <div className="qr-section">
                                <h2 style={{ marginTop: 0 }}>Share this QR Code with Clients</h2>
                                <div className="qr-container">
                                    <QRCode value={formUrl} size={200} level="H" includeMargin={true} />
                                </div>
                                <p style={{ fontSize: '12px', color: '#666', marginTop: '10px' }}>
                                    Form URL: <span className="code">{formUrl}</span>
                                </p>
                            </div>

                            <div style={{ display: 'flex', gap: '20px', marginBottom: '30px' }}>
                                <div className="stat-box">
                                    <div className="stat-number">{submissions.length}</div>
                                    <div className="stat-label">Total Submissions</div>
                                </div>
                            </div>

                            <h2>Recent Submissions</h2>
                            
                            {submissions.length === 0 ? (
                                <div className="empty-state">No submissions yet</div>
                            ) : (
                                <div style={{ overflowX: 'auto' }}>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Email</th>
                                                <th>Phone</th>
                                                <th>Date</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {[...submissions].reverse().map((submission) => (
                                                <tr key={submission.id}>
                                                    <td>{submission.name}</td>
                                                    <td>{submission.email}</td>
                                                    <td>{submission.phone}</td>
                                                    <td>{submission.timestamp}</td>
                                                    <td>
                                                        <button
                                                            className="danger-btn"
                                                            onClick={() => deleteSubmission(submission.id)}
                                                        >
                                                            Delete
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            <div className="export-section">
                                <button className="export-btn" onClick={exportToCSV}>
                                    📥 Export to CSV
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
