<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Form System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
        }
        
        h2 {
            font-size: 18px;
            color: #333;
            margin: 20px 0 15px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        
        button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .secondary-btn {
            background-color: #6c757d;
            margin-top: 20px;
            width: auto;
        }
        
        .secondary-btn:hover {
            background-color: #5a6268;
        }
        
        .danger-btn {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        
        .danger-btn:hover {
            background-color: #c82333;
        }
        
        .logout-btn {
            background-color: #dc3545;
            margin-top: 0;
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
        
        .success-msg {
            margin-top: 15px;
            padding: 12px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 4px;
            text-align: center;
        }
        
        .error-msg {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 4px;
            text-align: center;
        }
        
        .hidden {
            display: none;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        
        .dashboard-header h1 {
            margin: 0;
        }
        
        .qr-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 6px;
        }
        
        .qr-image {
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 4px;
        }
        
        .stat-box {
            padding: 20px;
            background-color: #f0f4ff;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            background-color: #f0f0f0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .export-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .export-btn {
            background-color: #28a745;
            max-width: 200px;
            margin: 0 auto;
        }
        
        .export-btn:hover {
            background-color: #218838;
        }
        
        .code {
            background-color: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- FORM PAGE -->
    <div id="formPage" class="container">
        <div class="card">
            <h1>Contact Information</h1>
            <form id="contactForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="Enter your phone" required>
                </div>
                <button type="submit">Submit</button>
            </form>
            <div id="successMsg" class="success-msg hidden">✓ Thanks! Your info was received.</div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="secondary-btn" onclick="goToDashboard()">Admin Dashboard</button>
            </div>
        </div>
    </div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="container hidden">
        <div class="card">
            <h1>Dashboard Login</h1>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter admin password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="loginError" class="error-msg hidden">Wrong password</div>
            <button class="secondary-btn" onclick="goToForm()">Back to Form</button>
        </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="dashboard-container hidden">
        <div class="card">
            <div class="dashboard-header">
                <h1 style="margin: 0;">Submissions Dashboard</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="qr-section">
                <h2 style="margin-top: 0;">Share this QR Code with Clients</h2>
                <img id="qrCode" class="qr-image" alt="QR Code">
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    Form URL: <span class="code" id="formUrl"></span>
                </p>
            </div>

            <div class="stat-box">
                <div class="stat-number" id="submissionCount">0</div>
                <div class="stat-label">Total Submissions</div>
            </div>

            <h2>Recent Submissions</h2>
            <div id="submissionsTable"></div>

            <div class="export-section">
                <button class="export-btn" onclick="exportToCSV()">📥 Export to CSV</button>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = 'realEstate26';
        const formUrl = window.location.origin;

        function submitForm(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            const submission = {
                id: Date.now(),
                name,
                email,
                phone,
                timestamp: new Date().toLocaleString()
            };

            let submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
            submissions.push(submission);
            localStorage.setItem('formSubmissions', JSON.stringify(submissions));

            document.getElementById('contactForm').reset();
            document.getElementById('successMsg').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('successMsg').classList.add('hidden');
            }, 3000);
        }

        function goToDashboard() {
            document.getElementById('formPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function goToForm() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('formPage').classList.remove('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            
            if (password === PASSWORD) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                loadDashboard();
                document.getElementById('passwordInput').value = '';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('loginError').classList.add('hidden');
                }, 2000);
            }
        }

        function loadDashboard() {
            const submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
            
            // Set QR Code
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(formUrl)}`;
            document.getElementById('formUrl').textContent = formUrl;
            
            // Set submission count
            document.getElementById('submissionCount').textContent = submissions.length;
            
            // Render table
            let html = '';
            if (submissions.length === 0) {
                html = '<div class="empty-state">No submissions yet</div>';
            } else {
                html = '<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Action</th></tr></thead><tbody>';
                submissions.reverse().forEach(sub => {
                    html += `<tr>
                        <td>${sub.name}</td>
                        <td>${sub.email}</td>
                        <td>${sub.phone}</td>
                        <td>${sub.timestamp}</td>
                        <td><button class="danger-btn" onclick="deleteSubmission(${sub.id})">Delete</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
            document.getElementById('submissionsTable').innerHTML = html;
        }

        function deleteSubmission(id) {
            let submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
            submissions = submissions.filter(s => s.id !== id);
            localStorage.setItem('formSubmissions', JSON.stringify(submissions));
            loadDashboard();
        }

        function logout() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function exportToCSV() {
            const submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
            let csv = 'Name,Email,Phone,Date\n';
            submissions.forEach(s => {
                csv += `"${s.name}","${s.email}","${s.phone}","${s.timestamp}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'submissions.csv';
            a.click();
        }
    </script>
</body>
</html>
